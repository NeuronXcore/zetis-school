[alembic]
script_location = alembic
prepend_sys_path = .
# `path_separator` remplace `version_path_separator` (déprécié) et couvre AUSSI le découpage de
# `prepend_sys_path`. Sans lui, alembic émet une DeprecationWarning et se rabat sur un découpage
# hérité, sur espaces / virgules / DEUX-POINTS — ce qui casserait un chemin Windows dès qu'il y en
# aurait plusieurs. Ici `prepend_sys_path` vaut « . », donc le comportement est identique ; le
# changement est fait pour la dépréciation, pas pour un bug observé.
# ⚠️ Le dépôt traite les warnings en erreurs (`filterwarnings = ["error"]`) : la dépréciation
# faisait rougir `app/tests/test_migrations_graph.py`, qui construit un `Config`.
path_separator = os

# L'URL est fournie dynamiquement par alembic/env.py (settings.database_url).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
