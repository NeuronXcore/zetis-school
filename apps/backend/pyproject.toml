[project]
name = "zetis-backend"
version = "0.1.0"
description = "ZETIS backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Déclaré alors qu'AUCUN module n'importe `starlette` : le code fait
    # `from fastapi import status`, mais ces constantes sont celles de starlette, que fastapi
    # se contente de ré-exporter. Le plancher porte donc sur l'API réellement utilisée, pas
    # sur son emballage — et il ne dépend pas de la version de fastapi qui la tire.
    # 0.48 est MESURÉ, pas supposé : 0.47.3 n'a ni HTTP_422_UNPROCESSABLE_CONTENT ni
    # HTTP_413_CONTENT_TOO_LARGE, 0.48.0 les a. Sous ce plancher, l'app casse à l'IMPORT
    # (AttributeError), pas au premier appel.
    "starlette>=0.48",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.1",
    "youtube-transcript-api>=1.0",
    "redis>=5.0",
    "rq>=1.16",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # `TestClient` de starlette hérite de la classe `Client` d'un httpx, et depuis starlette 1.3
    # il veut celle de **httpx 2.x** — publié sous le nom `httpx2` PRÉCISÉMENT pour cohabiter
    # avec `httpx`. Sans lui, starlette retombe sur `httpx` en émettant une dépréciation : ça
    # marche encore, jusqu'au jour où starlette retire le repli, et ce jour-là c'est la suite
    # ENTIÈRE qui tombe d'un coup.
    #
    # ⚠️ Les deux sont installés, et c'est VOULU : `httpx2` ne sert qu'aux tests, `httpx` reste
    # celui du code applicatif — les trois providers LLM (ollama, anthropic, mlx) et
    # `production/failures.py` l'importent, et `test_production_durabilite.py` s'appuie sur ses
    # types d'exception (`httpx.ConnectError`, `httpx.HTTPStatusError`). Ne pas « unifier » les
    # deux : ce sont deux usages disjoints qui n'ont aucune raison de bouger ensemble.
    "httpx2>=2.10",
]
# Voix des capsules (ADR-0007). Optionnel : le code appelle le binaire `piper` en
# sous-processus (pas d'import Python). `pip install -e '.[tts]'` fournit la CLI + onnxruntime,
# puis télécharger un modèle de voix FR (.onnx) et le pointer via PIPER_VOICE_MODEL.
tts = [
    "piper-tts>=1.2.0",
]
# Dictée ELI5 (ADR-0012). Optionnel : STT 100 % local via faster-whisper (CTranslate2,
# sans torch). `pip install -e '.[stt]'` puis 1er usage télécharge le modèle (WHISPER_MODEL,
# défaut 'small' = rapide ; 'medium'/'large-v3' plus précis, plus lents). Sans ce paquet,
# /transcribe répond 503 et le micro est masqué côté front.
stt = [
    "faster-whisper>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# Un avertissement que personne ne lit est un vert qui ne prouve rien. Les deux dépréciations
# Starlette levées le 2026-08-12 s'affichaient à CHAQUE run depuis des mois — lues par personne.
# `error` déplace le moment où ça fait mal : la suite rougit le jour où une bibliothèque
# **déprécie**, pendant qu'il reste un chemin de sortie, au lieu du jour où elle **retire**, où
# c'est la suite entière qui tombe d'un coup sans préavis.
#
# Coût MESURÉ le 2026-08-12, pas supposé : les 1212 tests passent déjà sous `-W error`. Et le
# mode attrape les DEUX natures — l'avertissement levé pendant un test (échec) comme celui levé
# à l'import d'un module (erreur de collecte, encore plus bruyante). Vérifié par sabotage des
# deux côtés.
#
# 🔴 **Le vrai danger n'est pas ce bloc, c'est ce qu'on y ajoutera.** Le jour où une dépendance
# tierce émettra un avertissement qui n'est pas le vôtre, la suite rougira pour une raison
# étrangère, et la tentation sera d'écrire `"ignore::DeprecationWarning"`. Cette ligne rendrait
# ce bloc PIRE que son absence : elle muselerait tout en se donnant l'air d'une politique.
# Toute exception ajoutée ici vise un MESSAGE précis, jamais une catégorie, et porte sa date et
# son motif — comme le plancher `starlette>=0.48` plus haut.
filterwarnings = ["error"]
