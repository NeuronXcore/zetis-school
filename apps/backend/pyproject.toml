[project]
name = "zetis-backend"
version = "0.1.0"
description = "ZETIS backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Déclaré alors qu'AUCUN module n'importe `starlette` : le code fait
    # `from fastapi import status`, mais ces constantes sont celles de starlette, que fastapi
    # se contente de ré-exporter. Le plancher porte donc sur l'API réellement utilisée, pas
    # sur son emballage — et il ne dépend pas de la version de fastapi qui la tire.
    # 0.48 est MESURÉ, pas supposé : 0.47.3 n'a ni HTTP_422_UNPROCESSABLE_CONTENT ni
    # HTTP_413_CONTENT_TOO_LARGE, 0.48.0 les a. Sous ce plancher, l'app casse à l'IMPORT
    # (AttributeError), pas au premier appel.
    "starlette>=0.48",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.1",
    "youtube-transcript-api>=1.0",
    "redis>=5.0",
    "rq>=1.16",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
# Voix des capsules (ADR-0007). Optionnel : le code appelle le binaire `piper` en
# sous-processus (pas d'import Python). `pip install -e '.[tts]'` fournit la CLI + onnxruntime,
# puis télécharger un modèle de voix FR (.onnx) et le pointer via PIPER_VOICE_MODEL.
tts = [
    "piper-tts>=1.2.0",
]
# Dictée ELI5 (ADR-0012). Optionnel : STT 100 % local via faster-whisper (CTranslate2,
# sans torch). `pip install -e '.[stt]'` puis 1er usage télécharge le modèle (WHISPER_MODEL,
# défaut 'small' = rapide ; 'medium'/'large-v3' plus précis, plus lents). Sans ce paquet,
# /transcribe répond 503 et le micro est masqué côté front.
stt = [
    "faster-whisper>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
