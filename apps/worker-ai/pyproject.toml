[project]
name = "zetis-worker-ai"
version = "0.1.0"
description = "ZETIS worker-ai : génération des cartes SRS (RQ + LLM local Ollama), ADR-0013"
requires-python = ">=3.11"
# Réutilise le package backend (`app.*`) pour la config, la DB et la génération SRS
# (`run_lesson_card_generation` → provider Ollama local, session propre). En dev : installer
# le backend dans le même venv (`pip install -e ../backend`), ce qui fournit aussi rq/redis,
# puis lancer le worker avec `apps/worker-ai` sur le PYTHONPATH. Voir README.md.
dependencies = [
    "rq>=1.16",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
