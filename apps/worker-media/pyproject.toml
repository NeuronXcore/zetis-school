[project]
name = "zetis-worker-media"
version = "0.1.0"
description = "ZETIS worker-media : rendu MP4 sandboxé des capsules (RQ + Remotion/Node)"
requires-python = ">=3.11"
# Réutilise le package backend (`app.*`) pour la DB, la config, le stockage et le service
# capsules. En dev : installer le backend dans le même venv (`pip install -e ../backend`),
# ce qui fournit aussi rq/redis/minio (dépendances backend), puis lancer le worker avec
# `apps/worker-media` sur le PYTHONPATH. Voir README.md.
dependencies = [
    "rq>=1.16",
    "redis>=5.0",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
