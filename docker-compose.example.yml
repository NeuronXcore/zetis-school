services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zetis
      POSTGRES_USER: zetis
      POSTGRES_PASSWORD: zetis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zetis_minio
      MINIO_ROOT_PASSWORD: zetis_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
