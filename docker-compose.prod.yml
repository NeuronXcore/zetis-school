# =====================================================================
# ZETIS — compose PROD-LIKE : TOUTE l'app containerisée, une commande.
#   pnpm prod:up     (= docker compose -f docker-compose.prod.yml up --build)
#   pnpm prod:down   /   pnpm prod:logs
#
# Ollama reste sur l'HÔTE (GPU Metal, impossible en conteneur Mac) : le backend
# l'atteint via host.docker.internal. Prérequis hôte :
#   ollama serve   &&   ollama pull qwen3.6:35b-a3b
#
# TOUS les services portent `restart: unless-stopped` — application de l'ADR-0046 §1, qui pose la
# propriété sur le `worker` et en donne la doctrine : « un dispositif dont une pièce doit être
# lancée à la main finit toujours par tourner sans elle. » Le worker seul ne suffisait pas : après
# un redémarrage du Mac, la base, le backend et les deux frontends ne revenaient pas — le worker
# se relevait dans le vide. ⚠️ `unless-stopped`, pas `always` : un `prod:down` volontaire doit
# rester un arrêt, pas un service qui insiste. C'est aussi pourquoi `docker compose kill` NE PROUVE
# RIEN ici (faux négatif mesuré le 2026-08-08) — cf. `docs/devops/worker-production.md`.
#
# LA PROD POSSÈDE LES PORTS CANONIQUES : 8000 / 5173 / 5174. C'est elle qui tourne en
# permanence et dont Massimo garde l'adresse ; le dev, lui, se déplace. Sur une machine où la prod
# tourne, le dev passe par les paires de `.claude/launch.json` (8001→8004 / 5175→5180), qui
# existent depuis longtemps pour ça — `pnpm dev`, qui vise 8000/5173/5174, échouerait.
#
# Postgres et Redis de prod ne publient AUCUN port (réseau `interne`) : ils ne heurtent rien.
# MinIO est le seul service dont la publication gênait, et il a désormais ses propres ports.
# Les données sont cloisonnées de leur côté par `name: zetis-prod` (volumes `zetis-prod_*`).
# =====================================================================
name: zetis-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    networks: [interne]
    # 🔴 `:?` et non `:-` — un compose de PROD ne se rabat pas en silence sur un mot de passe de
    # développement écrit en clair dans le dépôt. Sans la variable, `prod:up` s'arrête avec ce
    # message au lieu de démarrer une base ouverte avec un secret public.
    # ⚠️ Postgres ne fixe le mot de passe qu'à l'INITIALISATION du volume : sur un volume
    # `zetis-prod_postgres_data` déjà créé, il faut reprendre la valeur d'origine, ou supprimer le
    # volume. Changer la variable seule donne une erreur d'authentification, pas un nouveau
    # mot de passe.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetis}
      POSTGRES_USER: ${POSTGRES_USER:-zetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definis-le dans le .env de la racine — pas de mot de passe de dev en prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zetis}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [interne]
    # `redis-cli` est dans l'image officielle. Sans ce healthcheck, les dépendants ne pouvaient
    # attendre que `service_started` — c'est-à-dire « le conteneur existe », pas « Redis répond ».
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zetis_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zetis_minio_password}
    # 🔴 Ports DISTINCTS du dev, et sous des NOMS DE VARIABLES distincts. Les deux compose lisent
    # le MÊME `.env` de la racine : réutiliser `MINIO_PORT` ferait déménager les deux stacks
    # ensemble, ce qui est exactement le défaut qu'on referme ici.
    # ⚠️ Rien d'autre que la console d'admin ne passe par là : le backend et `worker-media`
    # joignent MinIO en `minio:9000` sur le réseau `interne`, et le NAVIGATEUR ne parle jamais à
    # MinIO — `MinioVideoBackend.read_video()` lit les octets côté serveur et c'est la route
    # backend qui les sert (aucune URL présignée nulle part).
    # ⚠️ CES DEUX PUBLICATIONS SONT INERTES, et c'est un choix. `minio` n'est que sur `interne`
    # (`internal: true`) : Docker n'y attache aucune liaison hôte — mesuré le 2026-08-18,
    # `docker port` rend « aucune liaison ». La console d'admin n'est donc PAS joignable depuis le
    # Mac. On ne le corrige pas en ajoutant `externe` : ça donnerait un egress au magasin de
    # données pour le seul confort d'une console. Elles restent déclarées parce qu'elles réservent
    # les ports côté documentation et que le verrou de cohabitation s'en sert.
    ports:
      - "${MINIO_PORT_PROD:-9002}:9000"
      - "${MINIO_CONSOLE_PORT_PROD:-9003}:9001"
    volumes:
      - minio_data:/data
    networks: [interne]
    # `curl` est dans l'image officielle, et `/minio/health/live` est la sonde documentée.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      # `service_healthy` depuis que redis et minio ont un healthcheck : `service_started`
      # attendait que le CONTENEUR existe, pas que le service réponde.
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # ⚠️ ANCRE YAML — le service `worker` réutilise ce bloc TEL QUEL (`*generation-env`).
    # Ce n'est pas de l'élégance : le worker exécute EXACTEMENT les mêmes générateurs que le
    # backend (cours, fiche, srs, mindmap, quiz, capsule, curriculum, diagnostic — tout ce qui
    # passe par `travaux.enfiler`). Deux blocs recopiés divergeraient au premier ajout, et la
    # divergence ne se verrait qu'en production, sur un travail qui échoue. L'ancre rend
    # l'invariant structurel au lieu de le confier à un commentaire.
    environment: &generation-env
      # Le worker de CE déploiement est supervisé (`restart: unless-stopped` plus bas) : l'arrêter
      # le fait revenir avec le code à jour. C'est ce qui ouvre le geste « Redémarrer ce worker »
      # côté Papa. ⚠️ Volontairement DANS l'ancre : la variable décrit le déploiement, et elle est
      # vraie pour les deux conteneurs qui la liront.
      PRODUCTION_WORKER_SUPERVISED: "true"
      ZETIS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zetis}:${POSTGRES_PASSWORD:?definis-le dans le .env de la racine — pas de mot de passe de dev en prod}@postgres:5432/${POSTGRES_DB:-zetis}
      # Ollama sur l'hôte (le modèle doit y être pull).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6:35b-a3b}
      # Dérogation curriculum (ADR-0009) : clé lue depuis le .env à la RACINE du repo
      # (convention : les clés API ne vivent que là — compose la substitue au `up`).
      # Sans clé : 503 explicite sur la génération de programme, le reste fonctionne.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CURRICULUM_LLM_PROVIDER: ${CURRICULUM_LLM_PROVIDER:-anthropic}
      EMBED_PROVIDER: ollama
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      REDIS_URL: redis://redis:6379/0
      # Vidéos de capsule → MinIO ; audio partagé avec worker-media via volume.
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zetis_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zetis_minio_password}
      MINIO_BUCKET_CAPSULES: ${MINIO_BUCKET_CAPSULES:-capsules}
      AUDIO_STORAGE_DIR: /shared/audio
    volumes:
      - capsule_audio:/shared/audio
    ports:
      - "${API_PORT:-8000}:8000"
    # `externe` EN PLUS de `interne` : il joint Ollama sur l'hôte et l'API Anthropic pour les
    # tâches `curriculum_*`. Un service sur le seul réseau `interne` n'a aucun egress.
    networks: [interne, externe]
    # Limite MESURÉE, pas devinée : relevé à vide le 2026-08-08 — backend 92 Mio, worker 41 Mio
    # (`docker stats` sur la pile réelle). 1 Go laisse ~10× de marge pour les pointes non mesurées :
    # extraction PDF du RAG côté backend, voix Piper (ONNX) côté worker.
    # ⚠️ Une limite trop basse serait PIRE que pas de limite : un OOM-kill en pleine génération
    # ressemblerait exactement à la panne que ce chantier corrige. Elle est récupérable — le
    # `restart: unless-stopped` du worker relance — mais le travail en cours serait perdu.
    # À relever si un OOM apparaît, jamais à baisser sans nouvelle mesure sous charge.
    mem_limit: 1g
    # Permet au conteneur de joindre Ollama sur l'hôte (Linux : host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ce healthcheck n'est pas décoratif : c'est lui qui rend `condition: service_healthy`
    # disponible pour le `worker` ci-dessous, donc lui qui garantit que les migrations sont
    # passées avant qu'un second conteneur touche la base (ADR-0046 Décision 2).
    # `curl` est déjà dans l'image POUR CET USAGE (cf. backend.Dockerfile) ; la route existe
    # depuis l'étape 9 (`app/api/health.py`).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      # Généreux À DESSEIN : le premier démarrage applique les migrations Alembic ET le seed
      # avant qu'uvicorn n'écoute. Un `start_period` court ferait déclarer le backend malsain
      # pendant une migration longue, et le worker ne démarrerait jamais.
      start_period: 90s
      retries: 5
    restart: unless-stopped

  # ── Worker de production ──────────────────────────────────────────────────────────────────
  # Le 8e service, et le seul qui manquait à ce fichier (ADR-0046). Sans lui, le backend accepte
  # les lots en 202 et les enfile sur Redis (ADR-0031 §3) — et RIEN ne les consomme : la file
  # grossit en silence, l'écran dit « en file d'attente » (littéralement vrai), et Papa reclique.
  # Mesuré DEUX fois : 2026-08-05 (quatre lots, six heures) puis 2026-08-08 (trois diagnostics,
  # deux jours). `restart: unless-stopped` est la propriété qui referme ça.
  #
  # 🔴 JAMAIS de `--scale worker=N`. Concurrence 1, et ce n'est pas provisoire : un seul Ollama,
  # un seul GPU. Deux jobs en parallèle ne produiraient pas plus vite — ils se disputeraient la
  # même ressource et ralentiraient Massimo (en-tête de `app/production_worker.py`).
  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    # 🔴 `entrypoint`, PAS `command` — et c'est le piège principal de ce service.
    # L'image du backend porte un ENTRYPOINT en forme exec (`backend-entrypoint.sh`) qui fait
    # `alembic upgrade head`, le seed, puis `exec uvicorn`, et qui n'inspecte JAMAIS ses
    # arguments. Un `command:` serait donc silencieusement ignoré : ce service lancerait un
    # second uvicorn AVEC une seconde migration concurrente de celle du backend.
    # ⚠️ L'idiome du voisin ne transfère pas : `worker-media` utilise bien `CMD`, mais son image
    # n'a aucun ENTRYPOINT.
    entrypoint: ["python", "-m", "app.production_worker"]
    depends_on:
      # `service_healthy` et non `service_started` : l'entrypoint étant écrasé, ce conteneur ne
      # migre plus lui-même — il doit attendre que le backend l'ait fait.
      backend: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    # Identique au backend, par nécessité — voir l'ancre plus haut. En particulier :
    #   · ANTHROPIC_API_KEY / CURRICULUM_LLM_PROVIDER — les travaux `curriculum_chapters`,
    #     `curriculum_lessons` et `curriculum_skills_backfill` sont ENFILÉS (curriculum/router.py),
    #     donc exécutés ICI, et la dérogation ADR-0009 les route vers Anthropic. Sans la clé, la
    #     génération du référentiel échoue dans un worker — plus discret qu'un 503 rendu à Papa.
    #   · AUDIO_STORAGE_DIR + le volume — `capsule_generate` / `capsule_regenerate` /
    #     `capsule_voice` sont enfilés eux aussi : la voix Piper s'écrit dans le volume partagé,
    #     que `worker-media` relit pour le rendu MP4.
    environment: *generation-env
    volumes:
      - capsule_audio:/shared/audio
    # Mêmes réseaux que le backend, et pour la même raison : Ollama sur l'hôte + Anthropic.
    networks: [interne, externe]
    # Limite MESURÉE, pas devinée : relevé à vide le 2026-08-08 — backend 92 Mio, worker 41 Mio
    # (`docker stats` sur la pile réelle). 1 Go laisse ~10× de marge pour les pointes non mesurées :
    # extraction PDF du RAG côté backend, voix Piper (ONNX) côté worker.
    # ⚠️ Une limite trop basse serait PIRE que pas de limite : un OOM-kill en pleine génération
    # ressemblerait exactement à la panne que ce chantier corrige. Elle est récupérable — le
    # `restart: unless-stopped` du worker relance — mais le travail en cours serait perdu.
    # À relever si un OOM apparaît, jamais à baisser sans nouvelle mesure sous charge.
    mem_limit: 1g
    # Aucun port publié : il ne sert rien, il consomme.
    # Il appelle Ollama sur l'HÔTE, exactement comme le backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-media:
    build:
      context: .
      dockerfile: infra/docker/worker-media.Dockerfile
    depends_on:
      redis: { condition: service_started }
      minio: { condition: service_started }
      postgres: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379/0
      # La config backend lit la DB via le préfixe ZETIS_ (pas de validation_alias) → il FAUT
      # ZETIS_DATABASE_URL, sinon le worker retombe sur le défaut localhost:5432 (connection refused).
      ZETIS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zetis}:${POSTGRES_PASSWORD:?definis-le dans le .env de la racine — pas de mot de passe de dev en prod}@postgres:5432/${POSTGRES_DB:-zetis}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zetis_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zetis_minio_password}
      MINIO_BUCKET_CAPSULES: ${MINIO_BUCKET_CAPSULES:-capsules}
      AUDIO_STORAGE_DIR: /shared/audio
      REMOTION_TIMEOUT: ${REMOTION_TIMEOUT:-600}
    volumes:
      - capsule_audio:/shared/audio
    # 🔴 `interne` SEUL, et c'est le point : Remotion n'appelle personne, et Chromium ne doit pas
    # pouvoir sortir. C'est le garde-fou du rendu (même intention que le compose de dev).
    networks: [interne]
    mem_limit: 2g
    cpus: 1.5
    # Chromium (Remotion) crashe/bloque avec le /dev/shm par défaut (64 Mo) sur des capsules
    # longues → on l'augmente pour fiabiliser le rendu.
    shm_size: "1gb"
    restart: unless-stopped

  frontend-massimo:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: frontend-massimo
    depends_on: [backend]
    # nginx sert du statique ; c'est le NAVIGATEUR qui appelle le backend, pas ce conteneur.
    # 🔴 `externe` EST NÉCESSAIRE, et pas pour sortir : un conteneur rattaché au SEUL réseau
    # `interne` (`internal: true`) ne peut PAS publier de port vers l'hôte. Docker accepte la
    # déclaration `ports:` ci-dessous et ne fait RIEN — sans erreur, sans avertissement. Mesuré le
    # 2026-08-18, au premier démarrage réel de la pile : `docker port` rendait « aucune liaison »
    # pour les deux frontends, et Massimo ne pouvait pas ouvrir ZETIS.
    #
    # ⚠️ Le coût est réel et assumé : ces conteneurs gagnent un egress dont ils n'ont pas besoin.
    # Docker ne sait pas donner l'ingress sans lui. Le garde-fou qui comptait dans l'ADR-0046 —
    # `worker-media` seul sur `interne`, « Chromium ne doit pas pouvoir sortir » — reste intact.
    networks: [interne, externe]
    ports:
      - "5173:80"
    restart: unless-stopped

  frontend-papa:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: frontend-papa
    depends_on: [backend]
    # 🔴 `externe` EST NÉCESSAIRE, et pas pour sortir : un conteneur rattaché au SEUL réseau
    # `interne` (`internal: true`) ne peut PAS publier de port vers l'hôte. Docker accepte la
    # déclaration `ports:` ci-dessous et ne fait RIEN — sans erreur, sans avertissement. Mesuré le
    # 2026-08-18, au premier démarrage réel de la pile : `docker port` rendait « aucune liaison »
    # pour les deux frontends, et Massimo ne pouvait pas ouvrir ZETIS.
    #
    # ⚠️ Le coût est réel et assumé : ces conteneurs gagnent un egress dont ils n'ont pas besoin.
    # Docker ne sait pas donner l'ingress sans lui. Le garde-fou qui comptait dans l'ADR-0046 —
    # `worker-media` seul sur `interne`, « Chromium ne doit pas pouvoir sortir » — reste intact.
    networks: [interne, externe]
    ports:
      - "5174:80"
    restart: unless-stopped

networks:
  # Toutes les communications entre services passent ici. `internal: true` = AUCUN egress
  # internet : un service qui n'est que sur ce réseau ne peut joindre que ses voisins.
  interne:
    internal: true
  # Joint par `backend` et `worker`, qui appellent Ollama sur l'hôte et l'API Anthropic
  # (dérogation `curriculum_*`, ADR-0009) — et, depuis le 2026-08-18, par les DEUX FRONTENDS, non
  # pour sortir mais pour être JOIGNABLES : Docker ne publie aucun port d'un conteneur qui n'est
  # que sur un réseau `internal`. Restent hors de ce réseau ceux qui doivent y rester :
  # `worker-media` (Chromium), `postgres`, `redis`, `minio`.
  externe:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  capsule_audio:
